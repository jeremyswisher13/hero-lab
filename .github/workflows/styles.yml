name: Check stylesheet bundles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_styles.py --check
      - run: python3 scripts/check_public_copy.py
      - run: node --test scripts/test_analytics.cjs
      - run: node --test scripts/test_newsletter.cjs
